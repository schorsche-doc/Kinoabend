<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kinoabend — вход администратора</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <main class="login-page">
      <section class="login-card">
        <a class="brand login-brand" href="{{ url_for('stage', stage=1) }}"><span class="brand-mark">K</span><span>Kinoabend</span></a>
        <p class="eyebrow">Admin access</p>
        <h1>Вход в<br><em>кинобудку.</em></h1>
        <p class="login-copy">Этапы розыгрыша и подтверждения доступны только администратору.</p>
        {% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}<div class="messages" aria-live="polite">{% for category, message in messages %}<p class="message message-{{ category }}">{{ message }}</p>{% endfor %}</div>{% endif %}{% endwith %}
        <form class="login-form" method="post" action="{{ url_for('admin_login', next=next_stage) }}">
          <label for="password">Пароль администратора</label>
          <input type="hidden" name="evening_date" value="{{ evening_date }}">
          <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
          <button class="button button-dark" type="submit">Открыть этап <span>→</span></button>
        </form>
      </section>
    </main>
  </body>
</html>
